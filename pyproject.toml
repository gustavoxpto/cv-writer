[project]
name = "cv-writer"
version = "0.1.0"
description = "Turn a job posting into a truthful, well-matched CV — see specs/features/001-cv-writer.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "playwright>=1.40,<2",
    "anthropic>=0.122,<1",
    "markdown>=3.10,<4",
    "pypdf>=6,<7",
    "Jinja2>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migration SQL scripts (ADR 0002) and the web UI's Jinja templates (ADR 0005) must ship with
# the package, not just work under an editable install where src/ is read directly.
cv_writer = ["db/migrations/*.sql", "web/templates/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
