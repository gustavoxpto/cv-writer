# Reference profile — entirely fake data, committed as a template.
#
# To start using the CV Writer: copy this file to data/profile.yaml and replace every field
# with real information. data/profile.yaml itself is gitignored (see .gitignore and spec
# criterion 31) because it holds real contact details and employment history — this example
# file is the only profile-shaped file that belongs in version control.
#
# Schema: src/cv_writer/profile/models.py. Validate with:
#   python -c "from cv_writer.profile import load_profile; load_profile('data/profile.yaml')"

identity:
  name: Ana Example
  email: ana@example.com
  phone: "+351 900 000 000"
  location: Lisbon, Portugal
  links:
    linkedin: https://linkedin.com/in/anaexample
    github: https://github.com/anaexample

languages:
  - name: English
    proficiency: professional
  - name: Portuguese
    proficiency: native

education:
  - institution: University of Lisbon
    degree: BSc Computer Science
    start_date: 2013-09-01
    end_date: 2017-07-01

job_histories:
  # Each history needs 3-5 STAR bullets and at least one quantified metric somewhere
  # among them (spec criteria 3-4). The metric's `value` is a verbatim string on purpose —
  # "+37%", "R$1.2M", "45min -> ~2min" don't share one numeric shape, and forcing a parse
  # would invite invented precision.
  - id: job-acme-2020
    company: Acme Corp
    role_title: Backend Engineer
    country: Portugal
    area: Engineering
    start_date: 2020-01-15
    end_date: 2022-06-30
    bullets:
      - id: job-acme-2020-b1
        situation: Checkout API had frequent timeouts under peak load.
        task: Bring p99 latency under the 500ms SLA.
        action: Profiled the request path and added a read-through cache for product lookups.
        result: Cut p99 latency from 1.4s to 320ms.
        metric:
          value: "-77%"
          unit: p99 latency
          baseline: "from 1.4s to 320ms"
      - id: job-acme-2020-b2
        situation: Deploys required a manual 45-minute runbook.
        task: Make deploys safe enough to run without a human babysitting them.
        action: Wrote a CI pipeline with automated smoke tests and one-click rollback.
        result: Deploys became a single click, run several times a day.
        metric:
          value: "45min -> ~2min"
          unit: deploy time
      - id: job-acme-2020-b3
        situation: New hires took weeks to make their first production change.
        task: Shorten onboarding time for backend engineers.
        action: Wrote an onboarding guide and pairing checklist for the backend team.
        result: New hires shipped a first change noticeably faster.
        # No metric on this bullet — that's fine, individual bullets may be qualitative
        # as long as the history has at least one quantified bullet elsewhere (it does).

  - id: job-globex-2022
    company: Globex
    role_title: Senior Backend Engineer
    country: Portugal
    area: Engineering
    start_date: 2022-07-01
    end_date: present  # unquoted literal "present" — not a date
    bullets:
      - id: job-globex-2022-b1
        situation: Support tickets about slow search were piling up.
        task: Reduce search latency without a full re-architecture.
        action: Added a caching layer in front of the search index.
        result: Search latency dropped noticeably and ticket volume fell.
        metric:
          value: "-60%"
          unit: search latency
      - id: job-globex-2022-b2
        situation: Onboarding a new microservice took a full sprint.
        task: Cut the time to stand up a new service.
        action: Built a service template with CI, health checks, and logging pre-wired.
        result: New services now ship in about a day.
      - id: job-globex-2022-b3
        situation: Incident reviews were inconsistent across teams.
        task: Standardize how incidents get reviewed and written up.
        action: Introduced a shared postmortem template and a weekly review meeting.
        result: Postmortems now happen consistently and are used to drive follow-ups.

skills:
  # `evidence` links a skill to the job history ids that back it up (spec criterion 5).
  # A skill with no evidence still loads — `profile_check()` flags it, it doesn't reject it.
  - name: Python
    category: language
    level: senior
    years: 6
    evidence: [job-acme-2020, job-globex-2022]
  - name: SQL
    category: database
    evidence: [job-globex-2022]
