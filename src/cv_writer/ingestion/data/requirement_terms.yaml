# Versioned, data-driven requirement vocabulary (spec 002 AC-001).
#
# What this is: the phrases the deterministic extractor looks for in posting text, and the
# canonical value each one resolves to. Loaded by ingestion/term_list.py, consumed by
# ingestion/requirements.py. No NLP, no model call — a curated list, not an oracle
# (ADR 0003, spec 001 criterion 14).
#
# HOW TO EXTEND IT — this is the point of the file. Hit a posting whose requirements the tool
# missed? Add the phrase under the right canonical key, bump `version`, done. No Python edit.
# If the canonical key is new, choose it to textually match the skill name in data/profile.yaml
# (see matching/matcher.py::_skill_name_matches), or the requirement will be extracted and then
# never match your evidence — which looks identical to not extracting it at all.
#
# `version` is an int and a unit test asserts it, so a forgotten bump fails loudly rather than
# leaving two different vocabularies both calling themselves the same list. Same guard, and the
# same reasoning, as generation/data/pt_pt_terms.yaml.
#
# Canonical keys must be unique within a group; term_list.py refuses to load a duplicate rather
# than let the later entry silently shadow the earlier one (.specs/LESSONS.md L-004).
#
# Phrases are matched on word boundaries by ingestion.requirements.word_boundary_pattern, so
# "sql" does not match inside "postgresql" and "git" does not match inside "github". Accents are
# significant: "inglés" and "ingles" are different strings and only the first is listed.
#
# History: keys 27-34 under `skills` and the accented language names arrived on 2026-08-19 as an
# ad hoc widening for one real Spanish posting, committed untested in 387d937. Spec 002 moved
# the whole vocabulary here and put it under test; see that spec's Appendix A.

