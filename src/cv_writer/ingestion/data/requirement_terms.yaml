# Headings that flip the extractor between the required and preferred zones of a posting.
# Order does not matter; matching is case-insensitive.
section_markers:
  required:
    - "requirements"
    - "required skills"
    - "must have"
    - "must-have"
    - "you have"
    - "what you'll need"
    - "what you will need"
    - "qualifications"
    - "what we're looking for"
    - "what we are looking for"
    # Spanish and Portuguese spell this heading identically (spec 002 AC-003).
    - "requisitos"
  preferred:
    - "nice to have"
    - "nice-to-have"
    - "preferred"
    - "preferred qualifications"
    - "bonus points"
    - "a plus"
    - "would be a plus"
    - "good to have"
    - "pluses"
    - "se valorará"
    # Portuguese for "differentiators" — the pt-BR/pt-PT equivalent of "nice to have".
    - "diferenciais"
